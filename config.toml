base_url = "https://flylang.org"
title = "Fly"
description = "A programming language for writing easily and quickly all types of software."
compile_sass = true
minify_html = false
generate_feeds = false

# The draft docs of the version in development (content/docs/Fly-*.md) are
# edited in place but published only as a release snapshot (content/docs/<version>/).
ignored_content = ["**/docs/Fly-*.md"]

[link_checker]
internal_level = "warn"
external_level = "warn"

[markdown.highlighting]
theme = "github-dark"

[extra]
github_org   = "https://github.com/fly-lang"
github_repo  = "https://github.com/fly-lang/fly"
releases_api = "https://api.github.com/repos/fly-lang/fly/releases"
bluesky      = "https://bsky.app/profile/flylang.org"
matrix       = "https://matrix.to/#/#flylang:matrix.org"
email        = "dev@flylang.org"

# Versioned documentation. content/docs/ is the current documentation (it
# tracks the branch under development); each published release has a frozen
# copy in content/docs/<version>/, made with scripts/snapshot-docs.sh.
[extra.docs]
latest         = "0.15.2"          # newest published release: /docs/ and /install/ show it
versions       = ["0.15.2", "0.15.0", "0.14.9", "0.13.19"]  # snapshots, newest first
