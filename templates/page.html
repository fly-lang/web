{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}
{% block description %}{{ page.description | default(value=config.description) }}{% endblock %}

{% block content %}

<section class="page-hero">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
  </div>
</section>

<section class="page-body">
  <div class="wrap wrap-narrow">
    {{ page.content | safe }}
  </div>
</section>

{% endblock %}
